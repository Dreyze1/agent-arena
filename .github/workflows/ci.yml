name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install package and lint tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest -q

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build and test tools
        run: python -m pip install -e ".[dev]" build twine

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/agent-arena-venv"
          "$RUNNER_TEMP/agent-arena-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/agent-arena-venv/bin/arena" --version
          "$RUNNER_TEMP/agent-arena-venv/bin/arena" adapters
